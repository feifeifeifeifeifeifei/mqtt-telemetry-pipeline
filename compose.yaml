# Broker, service and three simulated gateways, five containers in all:
# docker compose up -d --build --wait
#
# Every published port is bound to 127.0.0.1: the demo broker is anonymous, so
# neither it nor the API is reachable from outside this machine.

# What every gateway shares, in two parts; Compose ignores top-level keys that
# start with x-. The settings are an anchor of their own, merged inside each
# gateway's environment: `<<` merges one level deep only, so an environment in
# x-simulator would be replaced whole by the gateway's own, not combined with it.
x-simulator-env: &simulator-env
  MQTT_HOST: "broker"
  # From .env when set there; otherwise empty, which means anonymous.
  MQTT_USERNAME: "${MQTT_USERNAME:-}"
  MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
  SIM_FAULT_EVERY: "${SIM_FAULT_EVERY:-10}"

# The build and the start order, merged in at each gateway's top level. No
# environment here: the gateway's own would replace it, as above.
x-simulator: &simulator
  build: ./simulator
  depends_on:
    service:
      condition: service_healthy    # the first frame goes out only once the service listens

services:
  broker:
    image: eclipse-mosquitto:2.0.22   # an exact tag: the demo must not change under you
    ports:
      - "127.0.0.1:1883:1883"         # the smoke test connects from the host
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  service:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MQTT_HOST: broker
      # From .env when set there; otherwise empty, which means anonymous.
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on:
      - broker                        # start order only: the service retries until the broker answers
    healthcheck:
      # Readiness, not liveness: healthy once the service has connected to the
      # broker and subscribed. /health itself answers 200 either way. Docker
      # does not restart an unhealthy container; the state only gates
      # depends_on below and `up --wait`. The image has no curl, hence Python.
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; body = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); sys.exit(0 if body['broker_connected'] else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One container per device, named after it, so each can be stopped on its
  # own. All three play the same 240-tick story, each joining it at its own
  # tick, and their seeds place the faults and the noise differently. Each
  # takes its build and its depends_on from x-simulator above.
  gateway-01:
    <<: *simulator
    environment:
      <<: *simulator-env
      SIM_DEVICE_ID: "gateway-01"
      SIM_SEED: "${SIM_SEED:-7}"      # the only device SIM_SEED changes
      SIM_START_TICK: "0"

  gateway-02:
    <<: *simulator
    environment:
      <<: *simulator-env
      SIM_DEVICE_ID: "gateway-02"
      SIM_SEED: "8"
      SIM_START_TICK: "80"            # a third of the way into the story

  gateway-03:
    <<: *simulator
    environment:
      <<: *simulator-env
      SIM_DEVICE_ID: "gateway-03"
      SIM_SEED: "9"
      SIM_START_TICK: "160"           # two thirds of the way in
