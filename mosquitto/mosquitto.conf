# Local demo broker: anonymous on purpose, and compose publishes its port on
# 127.0.0.1 only, so nothing outside this machine can reach it.

# Without a listener line, mosquitto 2.x listens on the loopback interface of
# its own container only, where the service and the simulator cannot reach it.
listener 1883
allow_anonymous true

# To require a login instead: set allow_anonymous to false, create a password
# file with mosquitto_passwd, mount it next to this file in compose.yaml,
# uncomment the line below, and put MQTT_USERNAME and MQTT_PASSWORD in .env so
# that both the service and the simulator log in.
# password_file /mosquitto/config/passwd
