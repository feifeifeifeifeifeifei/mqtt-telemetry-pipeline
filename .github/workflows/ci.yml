# Runs on every push: the test suite on each supported Python, the README's
# compose stack end to end, and mutation testing of the validator.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The smoke test skips itself here: this job has no broker.
      - name: Run the test suite
        run: python -m pytest -q

  stack:
    name: compose stack and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Start broker, service and simulator (the README quick start)
        run: docker compose up -d --build --wait
      # The smoke test brings its own ingestor; this checks the service
      # container that the quick start actually starts.
      - name: The service in the container receives the simulator's telemetry
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/v1/system-status -o status.json \
              && python -c "import json, sys; body = json.load(open('status.json')); sys.exit(0 if body['device_id'] == 'gateway-01' else 1)"; then
              echo "system-status answered 200 for gateway-01 after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "system-status did not answer 200 for gateway-01 within 30 s:"
          curl -sS --max-time 5 http://127.0.0.1:8000/api/v1/system-status || true
          exit 1
      - name: Smoke test against the running stack
        run: python -m pytest -m smoke -q --junitxml=smoke.xml
      # pytest exits 0 when its only test is skipped, so a smoke test that
      # could not reach the broker would otherwise pass unnoticed.
      - name: The smoke test really ran (a skip would also exit 0)
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("smoke.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {key: int(suite.get(key, 0)) for key in ("tests", "skipped", "failures", "errors")}
          print(counts)
          if counts != {"tests": 1, "skipped": 0, "failures": 0, "errors": 0}:
              sys.exit(1)
          EOF
      - name: Show containers and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  mutation:
    name: mutation testing (validation.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run mutmut (configured in setup.cfg)
        run: mutmut run
      - name: Export the mutation statistics
        run: mutmut export-cicd-stats
      # Anything other than "killed" fails the job: survived, timeout,
      # suspicious, no tests or segfault.
      - name: Every mutant is killed
        run: |
          python - <<'EOF'
          import json
          import os
          import sys

          with open("mutants/mutmut-cicd-stats.json") as f:
              stats = json.load(f)
          line = f"{stats['total']} mutants, {stats['killed']} killed"
          print(line)
          print(stats)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Mutation testing: validation.py\n\n{line}\n\n")
              summary.write("```json\n" + json.dumps(stats, indent=2) + "\n```\n")
          if stats["total"] == 0 or stats["killed"] != stats["total"]:
              sys.exit(1)
          EOF
      - name: List the mutants that were not killed
        if: failure()
        run: mutmut results
