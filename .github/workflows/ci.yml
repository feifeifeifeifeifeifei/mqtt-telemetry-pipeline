# Runs on every push: the test suite on each supported Python, the README's
# compose stack end to end, and mutation testing of the validator.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The smoke test skips itself here: this job has no broker.
      - name: Run the test suite
        run: python -m pytest -q

  stack:
    name: compose stack and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Start the broker, the service and the three gateways (the README quick start)
        run: docker compose up -d --build --wait
      # The smoke test brings its own ingestor; this checks the service
      # container that the quick start actually starts, and through it every
      # gateway container: one that cannot reach the broker never shows up.
      - name: The service in the container hears from all three gateways
        run: |
          all_three_live() {
            python - <<'EOF'
          import json
          import sys

          with open("devices.json") as f:
              rows = json.load(f)["devices"]
          ids = sorted(row["device_id"] for row in rows)
          live = all(not row["stale"] and row["messages_received"] > 0 for row in rows)
          sys.exit(0 if ids == ["gateway-01", "gateway-02", "gateway-03"] and live else 1)
          EOF
          }
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/v1/devices -o devices.json \
              && all_three_live; then
              echo "gateway-01, gateway-02 and gateway-03 are live after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "/api/v1/devices did not show gateway-01, gateway-02 and gateway-03 live within 30 s:"
          curl -sS --max-time 5 http://127.0.0.1:8000/api/v1/devices || true
          exit 1
      - name: Smoke test against the running stack
        run: python -m pytest -m smoke -q --junitxml=smoke.xml
      # pytest exits 0 when its only test is skipped, so a smoke test that
      # could not reach the broker would otherwise pass unnoticed.
      - name: The smoke test really ran (a skip would also exit 0)
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("smoke.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {key: int(suite.get(key, 0)) for key in ("tests", "skipped", "failures", "errors")}
          print(counts)
          # At least one ran, none skipped, none failed. Pinning tests == 1
          # would turn "somebody added a second smoke test" into a red build
          # with a message about counts, which is not what this gate is for:
          # it exists because pytest exits 0 when its only test is skipped.
          if counts["tests"] < 1 or any(counts[key] for key in ("skipped", "failures", "errors")):
              sys.exit(1)
          EOF
      # The service marks a device stale once 30 s (STALE_AFTER_SECONDS) pass
      # without a message from it. Stopping one gateway must leave that one,
      # and only that one, stale.
      - name: A stopped gateway goes stale while the others stay live
        run: |
          only_gateway_03_stale() {
            python - <<'EOF'
          import json
          import sys

          with open("devices.json") as f:
              stale = {row["device_id"]: row["stale"] for row in json.load(f)["devices"]}
          sys.exit(0 if stale == {"gateway-01": False, "gateway-02": False, "gateway-03": True} else 1)
          EOF
          }
          docker compose stop gateway-03
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/v1/devices -o devices.json \
              && only_gateway_03_stale; then
              echo "gateway-03 is stale and gateway-01 and gateway-02 are live after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "/api/v1/devices did not show gateway-03 alone stale within 60 s:"
          curl -sS --max-time 5 http://127.0.0.1:8000/api/v1/devices || true
          exit 1
      - name: Show containers and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  mutation:
    name: mutation testing (validation.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run mutmut (configured in setup.cfg)
        run: mutmut run
      - name: Export the mutation statistics
        run: mutmut export-cicd-stats
      # Anything other than "killed" fails the job: survived, timeout,
      # suspicious, no tests or segfault.
      - name: Every mutant is killed
        run: |
          python - <<'EOF'
          import json
          import os
          import sys

          with open("mutants/mutmut-cicd-stats.json") as f:
              stats = json.load(f)
          line = f"{stats['total']} mutants, {stats['killed']} killed"
          print(line)
          print(stats)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Mutation testing: validation.py\n\n{line}\n\n")
              summary.write("```json\n" + json.dumps(stats, indent=2) + "\n```\n")
          if stats["total"] == 0 or stats["killed"] != stats["total"]:
              sys.exit(1)
          EOF
      - name: List the mutants that were not killed
        if: failure()
        run: mutmut results
